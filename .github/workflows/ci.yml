# Pipeline de contrôle — même script qu'en local (scripts/ci_check.py).
# Adaptable tel quel à GitLab CI / Jenkins : une seule commande à lancer.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Outils facultatifs
        run: pip install -r requirements-dev.txt
      - name: Build, tests, tests critiques, dépendances, lint
        run: python scripts/ci_check.py
